name: Release

# Runs on every version tag (v0.1.0, v1.2.3, …) and can be triggered manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Kept in step with ci.yml, which is the gate every change passes through and
  # which the qmllint baseline is measured against. Shipping on a Qt the gate
  # never ran on would mean the checks that guard a release ran somewhere else.
  QT_VERSION: '6.11.2'
  CMAKE_BUILD_TYPE: Release

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# ── Linux — AppImage ──────────────────────────────────────────────────────────
# Pinned to 22.04 rather than ubuntu-latest: an AppImage inherits the glibc of
# the machine that built it, so the oldest supported image is the one that runs
# on the most distros. 24.04 also dropped `libfuse2` (renamed `libfuse2t64`),
# which AppImages need to self-mount.
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgl1-mesa-dev libgles2-mesa-dev \
            libxcb-cursor0 libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-render-util0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libfuse2 \
            libpq-dev \
            libmariadb-dev \
            unixodbc-dev \
            firebird-dev \
            imagemagick

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets qthttpserver'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qub-linux-appimage
          path: dist/qub-*.AppImage
          if-no-files-found: error

# ── Windows — Inno Setup installer ────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtwebsockets qthttpserver'
          cache: true
          # Qt reorganised its Windows repository at 6.11: the metadata moved from
          # qt6_611N/qt6_611N/ to one directory per compiler (qt6_611N_msvc2022_64/).
          # Released aqtinstall 3.3.0 still builds the old path and 404s, so the
          # Windows job needs the unreleased fix. Pinned to a commit, never a
          # branch. This is about the 6.11 layout, not one patch release.
          # Drop this once aqtinstall 3.4.0 is on PyPI.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ISCC ships with the runner image but is not on PATH; install it only if
      # this image ever stops carrying it.
      - name: Put Inno Setup on PATH
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$iscc\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          Add-Content -Path $env:GITHUB_PATH -Value $iscc

      # NMake builds one file at a time, which cost this job 18 minutes a round.
      # Ninja is parallel and is what the other two jobs use; it is not on the
      # runner image, so install it.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy and package
        shell: pwsh
        run: packaging\windows\deploy.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qub-windows-setup
          path: dist/qub-*-setup.exe
          if-no-files-found: error

# ── macOS — DMG ───────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # libpq and libiodbc are keg-only, so they are named explicitly: Qt's
      # sqldrivers plugins reference libpq.5.dylib and libiodbc.2.dylib by the
      # absolute path they had on Qt's own build machine, and package.sh can
      # only repoint them at a copy it can actually find here.
      - name: Install dependencies
        run: brew install postgresql libpq libiodbc mariadb-connector-c

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets qthttpserver'
          cache: true

      # Ninja on purpose. The default generator here is Unix Makefiles, and
      # `--parallel` with no job count hands make a bare `-j`, which means
      # unlimited: every translation unit at once on a three-core runner, which
      # thrashes instead of building. Ninja picks a sane job count itself, and it
      # is what the Linux job already uses (8 minutes there against over an hour
      # here). It ships on the macOS runner image.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package DMG
        run: bash packaging/macos/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qub-macos-dmg
          path: dist/qub-*.dmg
          if-no-files-found: error

# ── Release — attach all artifacts to the tag ─────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    # The only permission the release step needs; GITHUB_TOKEN is issued
    # automatically, so there is no RELEASE_TOKEN secret to keep in sync.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          # A tag carrying a pre-release suffix (v0.44.9-rc.1, -beta.2, …) is
          # published as a pre-release, so test builds can go out through the
          # same pipeline without being offered as the current version.
          prerelease: ${{ contains(github.ref_name, '-') }}

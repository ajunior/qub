<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Top face: light, lit from above-left -->
    <linearGradient id="gTop" x1="22" y1="34" x2="78" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D4ECFF"/>
      <stop offset="100%" stop-color="#88C6F8"/>
    </linearGradient>
    <!-- Right face: main accent blue -->
    <linearGradient id="gRight" x1="64" y1="34" x2="64" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2BAEF8"/>
      <stop offset="100%" stop-color="#126ACC"/>
    </linearGradient>
    <!-- Left face: darkest, in shadow -->
    <linearGradient id="gLeft" x1="36" y1="34" x2="36" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1274DC"/>
      <stop offset="100%" stop-color="#083E96"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="100" height="100" rx="20" fill="#12151E"/>

  <!-- Top face -->
  <polygon points="50,18 78,34 50,50 22,34" fill="url(#gTop)"/>
  <!-- Right face -->
  <polygon points="78,34 78,66 50,82 50,50" fill="url(#gRight)"/>
  <!-- Left face -->
  <polygon points="22,34 50,50 50,82 22,66" fill="url(#gLeft)"/>

  <!-- Crisp highlight outline on top face -->
  <polygon points="50,18 78,34 50,50 22,34"
           fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="0.6" stroke-linejoin="round"/>

  <!--
    Letters projected onto each face using the face's own basis vectors.

    Left face  — x-axis: (0.875, 0.5), y-axis: (0, 1)  → matrix(0.875, 0.5, 0, 1, cx, cy)
    Right face — x-axis: (0.875,-0.5), y-axis: (0, 1)  → matrix(0.875,-0.5, 0, 1, cx, cy)
    Top face   — x-axis: (0.875, 0.5), y-axis:(-0.875, 0.5) → matrix(0.875,0.5,-0.875,0.5, cx,cy)
  -->

  <!-- "q" on left face  (center ≈ 36, 58) -->
  <text transform="matrix(0.875,0.5,0,1,36,58)"
        text-anchor="middle" dominant-baseline="central"
        font-size="13" font-family="sans-serif" font-weight="bold"
        fill="rgba(255,255,255,0.82)">q</text>

  <!-- "u" on top face  (center ≈ 50, 34) -->
  <text transform="matrix(0.875,0.5,-0.875,0.5,50,34)"
        text-anchor="middle" dominant-baseline="central"
        font-size="11" font-family="sans-serif" font-weight="bold"
        fill="#0D4FA8">u</text>

  <!-- "b" on right face (center ≈ 64, 58) -->
  <text transform="matrix(0.875,-0.5,0,1,64,58)"
        text-anchor="middle" dominant-baseline="central"
        font-size="13" font-family="sans-serif" font-weight="bold"
        fill="rgba(255,255,255,0.88)">b</text>
</svg>
